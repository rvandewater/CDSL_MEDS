[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CDSL-MEDS"
# Bump with `uv version --bump patch|minor|major`, then tag the commit with the same version.
version = "0.1.0"
authors = [{ name = "Medical Event Data Standard" }]
description = "An ETL pipeline to extract the COVID Data for Shared Learning dataset into MEDS."
readme = "README.md"
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Capped below the next minor: MEDS-Extract 0.x minors are breaking (MESSY syntax, runner CLI), so
# raise this deliberately when migrating. 0.8 is the first release where `etl.encoding` can name a
# codec per source, `_metadata` dictionary tables included, which CDSL's three Latin-1 tables need.
# 0.8.1 adds the `etl.post_stages` this spec runs, `_self` metadata on literal codes, and the
# `etl:` dataset descriptors (`license`, `raw_source_id_columns`, ...). The `[download]` extra
# provides `meds-extract-download`, which `meds-extract-run` spawns to stage the raw data.
# suMEDS adds vocabulary titles and parents to the code metadata in its `sumeds_enrich` post-stage
# (0.6.2), with the rules registered below. It soft-fails (a failed enrichment, e.g. without
# internet, leaves the build as it was) and records the enrichment in `metadata/dataset.json`. It
# is capped below the next minor for the same reason (its rules format and CLI are still 0.x).
dependencies = [
    "MEDS-extract[download]>=0.8.1,<0.9",
    "sumeds>=0.6.2,<0.7",
]

[dependency-groups]
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pytest-rerunfailures==16.1",
    "shfmt-py==3.12.0.2",
]

[project.entry-points."MEDS_extract.pipelines"]
CDSL = "CDSL_MEDS:event_configs.yaml"

# Registers the suMEDS rules under the same name, so `rules: CDSL` in the spec's `sumeds_enrich`
# stage and `--rules CDSL` in any suMEDS command find them.
[project.entry-points."sumeds.rules"]
CDSL = "CDSL_MEDS:sumeds_rules.yaml"

# The post-stage that describes the slot-coded diagnosis and neoplasm codes (`etl.post_stages`).
[project.entry-points."MEDS_transforms.stages"]
cdsl_describe_slot_codes = "CDSL_MEDS.code_descriptions:main"

[project.urls]
Homepage = "https://physionet.org/content/covid-data-shared-learning/1.0.0/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["CDSL_MEDS*"]

[tool.setuptools.package-data]
CDSL_MEDS = ["*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
