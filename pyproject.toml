[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CDSL-MEDS"
dynamic = ["version"]
authors = [{ name = "Medical Event Data Standard" }]
description = "An ETL pipeline to extract the COVID Data for Shared Learning dataset into MEDS."
readme = "README.md"
requires-python = ">=3.11.4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["meds-extract[download]>=0.7.0,<0.8"]

[project.scripts]
meds-extract-run = "CDSL_MEDS.pre_meds:run"

[dependency-groups]
dev = [
    "pre-commit~=3.8",
    "ruff>=0.11,<1.0",
    "pytest~=9.0",
    "pytest-rerunfailures==16.1",
    "shfmt-py==3.12.0.2",
]

[tool.setuptools_scm]

[project.entry-points."MEDS_extract.pipelines"]
CDSL = "CDSL_MEDS:event_configs.yaml"

[project.urls]
Homepage = "https://physionet.org/content/covid-data-shared-learning/1.0.0/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["CDSL_MEDS*"]

[tool.setuptools.package-data]
CDSL_MEDS = ["*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
