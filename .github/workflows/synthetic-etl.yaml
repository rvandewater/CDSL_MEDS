name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular release. It complements
# the hand-written fixture in tests/test_cdsl_etl.py, which checks specific values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # MESSY-synth 0.1.0 targets MEDS-Extract 0.8, so it shares the project environment and the
        # locked MEDS-Extract.
        run: |
          uv sync --locked
          uv pip install "MESSY_synth==0.1.0"

      - name: Generate and extract synthetic data
        # The config joins separate date and clock columns into timestamps with f-strings, e.g.
        # f"{$lab_date[0:10]} {$time_lab}". MESSY-synth cannot infer the format of each part, and
        # without one these events would parse no times and yield no rows, so each column is
        # registered with its format; the dry run reports per registration whether it matches.
        run: |
          uv run --locked MESSY-synth ./src/CDSL_MEDS/event_configs.yaml -o raw_synthetic/ --explain \
            --column-format "patient_01/admission_date_emerg=%Y-%m-%d" \
            --column-format "patient_01/time_admission_emerg=%H:%M:%S" \
            --column-format "patient_01/time_constant_first_emerg=%H:%M" \
            --column-format "patient_01/time_constant_last_emerg=%H:%M:%S" \
            --column-format "lab_06/lab_date=%Y-%m-%d" \
            --column-format "lab_06/time_lab=%H:%M:%S" \
            --column-format "vital_signs_04/constants_ing_date=%Y-%m-%d" \
            --column-format "vital_signs_04/constants_ing_time=%H:%M:%S" \
            --column-format "CDSL-1.0.0-dicom-metadata/StudyDate=%Y-%m-%d" \
            --column-format "CDSL-1.0.0-dicom-metadata/StudyTime=%H:%M:%S"
          uv run --locked meds-extract-run spec=CDSL output_dir=./CDSL_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "CDSL_meds_synth/metadata/$f"
          done
          # The sumeds_enrich post-stage soft-fails, so report the record rather than require it.
          jq '.sumeds_enrichment | {enriched, coverage, error}' CDSL_meds_synth/metadata/dataset.json
