name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular release. It complements
# the hand-written fixture in tests/test_cdsl_etl.py, which checks specific values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and extract synthetic data
        run: |
          # 0.0.1 cannot render chrono `%.f` or f-string date+time timestamps, which this spec
          # uses; pin the first commit that can until a newer MESSY_synth release is out.
          uv pip install "MESSY_synth @ git+https://github.com/rvandewater/MESSY_synth@a3ac4d9908826f69667501e36c2d5b61355141d5"
          uv run MESSY-synth ./src/CDSL_MEDS/event_configs.yaml -o raw_synthetic/ --explain
          uv run meds-extract-run spec=CDSL output_dir=./CDSL_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "CDSL_meds_synth/metadata/$f"
          done
