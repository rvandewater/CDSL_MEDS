name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular release. It complements
# the hand-written fixture in tests/test_cdsl_etl.py, which checks specific values.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate and extract synthetic data
        # MESSY-synth requires MEDS-Extract <0.8, while the ETL runs on 0.8.1, so it runs in a tool
        # environment of its own, on a copy of the spec that MEDS-Extract 0.7 can parse: the `etl:`
        # block keeps only the keys 0.7 knows (it rejects the per-source `encoding` mapping, the
        # dataset descriptors such as `license`, and `post_stages`), and literal-code events lose
        # their constant `_metadata` blocks, which 0.7 rejects. Neither changes which columns
        # MESSY-synth generates, and the generated files are UTF-8 anyway. That is safe while the
        # spec uses no other syntax new in 0.8 (such as `_table.joins`); the extraction itself runs
        # with this project's locked MEDS-Extract and the full spec, post-stages included.
        run: |
          uv run --locked python - ./src/CDSL_MEDS/event_configs.yaml ./synth_spec.yaml <<'EOF'
          import sys, yaml
          spec = yaml.safe_load(open(sys.argv[1]))
          keep = {"dataset_name", "raw_dataset_version", "n_subjects_per_shard", "split_fracs",
                  "external_splits_json_fp", "do_dedup_text_and_numeric", "description_separator"}
          spec["etl"] = {key: value for key, value in spec["etl"].items() if key in keep}
          for table, events in spec.items():
              if table in ("etl", "sources") or table.startswith("_"):
                  continue
              for event in events.values():
                  if isinstance(event, dict) and "$" not in str(event.get("code", "$")):
                      event.pop("_metadata", None)
          yaml.safe_dump(spec, open(sys.argv[2], "w"), sort_keys=False)
          EOF
          # 0.0.1 cannot render chrono `%.f` or f-string date+time timestamps, which this spec
          # uses; pin the first commit that can until a newer MESSY_synth release is out.
          uvx --python ${{ matrix.python-version }} \
            --from "MESSY_synth @ git+https://github.com/rvandewater/MESSY_synth@a3ac4d9908826f69667501e36c2d5b61355141d5" \
            MESSY-synth ./synth_spec.yaml -o raw_synthetic/ --explain
          uv run --locked meds-extract-run spec=CDSL output_dir=./CDSL_meds_synth \
            input_dir=raw_synthetic do_download=false
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "CDSL_meds_synth/metadata/$f"
          done
          # The sumeds_enrich post-stage soft-fails, so report the record rather than require it.
          jq '.sumeds_enrichment | {enriched, coverage, error}' CDSL_meds_synth/metadata/dataset.json
