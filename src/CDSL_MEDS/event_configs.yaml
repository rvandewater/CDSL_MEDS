medication_05:
  medication_start:
    code: f"MEDICATION//ATC5//{$id_atc5}//ATC7//{$id_atc7 ?? 'UNKNOWN'}"
    time: $drug_start_date::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $daily_avrg_dose::?float64
    text_value: $drug_comercial_name
    medication_id: $medication_id
    
    _metadata:
      atc7:
        id_atc7: $id_atc7
        description: $atc7_name
  medication_end:
    code: f"MEDICATION_END//ATC5//{$id_atc5}//ATC7//{$id_atc7 ?? 'UNKNOWN'}"
    time: $drug_end_date::?"%Y-%m-%d %H:%M:%S"
    text_value: $drug_comercial_name
    medication_id: $medication_id
    

lab_06:
  laboratory_result:
    code: f"LAB//{$item_lab}//{$ud_result ?? 'UNKNOWN'}"
    time: f"{$lab_date[0:10]} {$time_lab}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $val_result::?float64
    text_value: $result_text ?? $val_result
    reference_range: $ref_values
    lab_id: $lab_id
    

vital_signs_04:
  systolic_blood_pressure:
    code: '"VITAL//SYSTOLIC_BLOOD_PRESSURE"'
    time: f"{$constants_ing_date[0:10]} {$constants_ing_time}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $bp_max_ing::?float64
    vital_sign_id: $vital_sign_id
    
  diastolic_blood_pressure:
    code: '"VITAL//DIASTOLIC_BLOOD_PRESSURE"'
    time: f"{$constants_ing_date[0:10]} {$constants_ing_time}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $bp_min_ing::?float64
    vital_sign_id: $vital_sign_id
    
  temperature:
    code: '"VITAL//TEMPERATURE"'
    time: f"{$constants_ing_date[0:10]} {$constants_ing_time}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $temp_ing::?float64
    vital_sign_id: $vital_sign_id
    
  heart_rate:
    code: '"VITAL//HEART_RATE"'
    time: f"{$constants_ing_date[0:10]} {$constants_ing_time}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $hr_ing::?float64
    vital_sign_id: $vital_sign_id
    
  oxygen_saturation:
    code: '"VITAL//OXYGEN_SATURATION"'
    time: f"{$constants_ing_date[0:10]} {$constants_ing_time}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $sat_02_ing::?float64
    vital_sign_id: $vital_sign_id
    
  blood_glucose:
    code: '"VITAL//BLOOD_GLUCOSE"'
    time: f"{$constants_ing_date[0:10]} {$constants_ing_time}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $glu_ing::?float64
    vital_sign_id: $vital_sign_id
    

CDSL-1.0.0-dicom-metadata:
  imaging:
    code: f"IMAGING//{$Modality}//{$StudyDescription}//{$BodyPart}"
    time: f"{$StudyDate} {$StudyTime}"::?"%Y-%m-%d %H:%M:%S"
    text_value: $CodeMeaning
    study_id: $study_id
    image_id: $image_id
    view_position: $ViewPosition
    patient_position: $PatientPosition
    spatial_resolution: $SpatialResolution

sources:
  dataset_version: "1.0.0"
  dataset:
    - type: physionet
      base_url: https://physionet.org/files/covid-data-shared-learning/1.0.0
      username: ${oc.env:DATASET_DOWNLOAD_USERNAME}
      password: ${oc.env:DATASET_DOWNLOAD_PASSWORD}
      exclude: [IMAGES/**]
