# COVID Data for Shared Learning (CDSL) (PhysioNet v1.0.0) to MEDS.
# CDSL timestamps are deidentified but retain within-patient chronology. The diagnosis
# and procedure tables contain no time, so their events use the shared pseudotime anchor.
#
# Code metadata: `_metadata` blocks describe every code family emitted by a single event. Literal
# codes and the slot-coded diagnosis, procedure and neoplasm codes cannot carry `_metadata` (no
# components to join on; one code emitted by several slot events has several code templates), so
# `MEDS_extract-CDSL` fills them in after the pipeline (see `code_descriptions.py`).

etl:
  dataset_name: CDSL
  n_subjects_per_shard: 1000

_defaults:
  subject_id: $patient_id

patient_01:
  hospital_admission:
    code: HOSPITAL_ADMISSION
    time: $admission_d_inpat::?"%Y-%m-%d %H:%M:%S"

  hospital_discharge:
    code: f"HOSPITAL_DISCHARGE//{$destin_discharge ?? 'UNKNOWN'}"
    time: $discharge_date::?"%Y-%m-%d %H:%M:%S"
    _metadata:
      _self:
        description: >-
          f"Hospital discharge; discharge destination: {$destin_discharge ?? 'UNKNOWN'} (CDSL
          patient_01.destin_discharge)"

  icu_admission:
    code: ICU_ADMISSION
    time: $icu_date_in::?"%Y-%m-%d %H:%M:%S%.f"

  icu_discharge:
    code: ICU_DISCHARGE
    time: $icu_date_out::?"%Y-%m-%d %H:%M:%S%.f"

  age_at_admission:
    code: AGE_AT_ADMISSION
    time: $admission_d_inpat::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $age::?float64

  sex:
    code: f"SEX//{$sex}"
    time: $admission_d_inpat::?"%Y-%m-%d %H:%M:%S"
    _metadata:
      _self:
        description: >-
          f"Sex: {$sex} (CDSL patient_01.sex)"

  inpatient_diagnosis:
    code: f"INPATIENT_DIAGNOSIS//{$diag_inpat}"
    time: $admission_d_inpat::?"%Y-%m-%d %H:%M:%S"
    _metadata:
      _self:
        description: >-
          f"COVID-related diagnosis of the hospital admission: {$diag_inpat} (CDSL patient_01.diag_inpat)"

  emergency_visit:
    code: EMERGENCY_DEPARTMENT_VISIT
    time: f"{$admission_date_emerg[0:10]} {$time_admission_emerg}"::?"%Y-%m-%d %H:%M:%S"

  emergency_department:
    code: f"EMERGENCY_DEPARTMENT//{$department_emerg}"
    time: f"{$admission_date_emerg[0:10]} {$time_admission_emerg}"::?"%Y-%m-%d %H:%M:%S"
    _metadata:
      _self:
        description: >-
          f"Emergency department visit; department where the patient was treated: {$department_emerg}
          (CDSL patient_01.department_emerg)"

  emergency_diagnosis:
    code: f"EMERGENCY_DIAGNOSIS//{$diag_emerg}"
    time: f"{$admission_date_emerg[0:10]} {$time_admission_emerg}"::?"%Y-%m-%d %H:%M:%S"
    _metadata:
      _self:
        description: >-
          f"Diagnosis given in the emergency department: {$diag_emerg} (CDSL patient_01.diag_emerg)"

  mechanical_ventilation:
    code: '"MECHANICAL_VENTILATION" if $mechvent == "Yes"'
    time: $admission_d_inpat::?"%Y-%m-%d %H:%M:%S"

  emergency_first_systolic_blood_pressure:
    code: '"VITAL//SYSTOLIC_BLOOD_PRESSURE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_first_emerg}"::?"%Y-%m-%d %H:%M"
    numeric_value: $bp_max_first_emerg::?float64

  emergency_first_diastolic_blood_pressure:
    code: '"VITAL//DIASTOLIC_BLOOD_PRESSURE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_first_emerg}"::?"%Y-%m-%d %H:%M"
    numeric_value: $bp_min_first_emerg::?float64

  emergency_first_temperature:
    code: '"VITAL//TEMPERATURE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_first_emerg}"::?"%Y-%m-%d %H:%M"
    numeric_value: $temp_first_emerg::?float64

  emergency_first_heart_rate:
    code: '"VITAL//HEART_RATE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_first_emerg}"::?"%Y-%m-%d %H:%M"
    numeric_value: $hr_first_emerg::?float64

  emergency_first_oxygen_saturation:
    code: '"VITAL//OXYGEN_SATURATION"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_first_emerg}"::?"%Y-%m-%d %H:%M"
    numeric_value: $sat_02_first_emerg::?float64

  emergency_first_blood_glucose:
    code: '"VITAL//BLOOD_GLUCOSE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_first_emerg}"::?"%Y-%m-%d %H:%M"
    numeric_value: $glu_first_emerg::?float64

  emergency_first_urine_output:
    code: '"VITAL//URINE_OUTPUT"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_first_emerg}"::?"%Y-%m-%d %H:%M"
    numeric_value: $diuresis_first_emerg::?float64

  emergency_last_systolic_blood_pressure:
    code: '"VITAL//SYSTOLIC_BLOOD_PRESSURE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_last_emerg}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $bp_max_last_emerg::?float64

  emergency_last_diastolic_blood_pressure:
    code: '"VITAL//DIASTOLIC_BLOOD_PRESSURE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_last_emerg}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $bp_min_last_emerg::?float64

  emergency_last_temperature:
    code: '"VITAL//TEMPERATURE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_last_emerg}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $temp_last_emerg::?float64

  emergency_last_heart_rate:
    code: '"VITAL//HEART_RATE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_last_emerg}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $hr_last_emerg::?float64

  emergency_last_oxygen_saturation:
    code: '"VITAL//OXYGEN_SATURATION"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_last_emerg}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $sat_02_last_emerg::?float64

  emergency_last_blood_glucose:
    code: '"VITAL//BLOOD_GLUCOSE"'
    time: f"{$admission_date_emerg[0:10]} {$time_constant_last_emerg}"::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $glu_last_emerg::?float64

