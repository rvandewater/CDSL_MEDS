medication_05:
  medication_start:
    code: f"MEDICATION//ATC5//{$id_atc5}//ATC7//{$id_atc7 ?? 'UNKNOWN'}"
    time: $drug_start_date::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $daily_avrg_dose::?float64
    text_value: $drug_comercial_name
    medication_id: $medication_id

    _metadata:
      atc7:
        id_atc7: $id_atc7
        description: $atc7_name
      # One ATC parent: the ATC7 (level 5, chemical substance) code when it is well formed and
      # lies under the row's ATC5 code, else the ATC5 (level 4, chemical subgroup) code. The
      # description covers only rows without an ATC7 code, which the atc7 join cannot describe.
      _self:
        parent_codes: &atc_parent_code >-
          f"ATC/{$id_atc7}" if ((/^[A-Z][0-9]{2}[A-Z]{2}[0-9]{2}$/ in $id_atc7) and ($id_atc7[0:5] == $id_atc5))
          else f"ATC/{$id_atc5}" if (/^[A-Z][0-9]{2}[A-Z]{2}$/ in $id_atc5)
        description: >-
          f"Medication without an ATC7 code in the source; ATC5 category {$id_atc5} (CDSL
          medication_05.id_atc5)" if (($id_atc7 ?? "") == "")
  medication_end:
    code: f"MEDICATION_END//ATC5//{$id_atc5}//ATC7//{$id_atc7 ?? 'UNKNOWN'}"
    time: $drug_end_date::?"%Y-%m-%d %H:%M:%S"
    text_value: $drug_comercial_name
    medication_id: $medication_id
    _metadata:
      atc7:
        id_atc7: $id_atc7
        description: >-
          f"End of medication: {$atc7_name} (CDSL atc7.atc7_name)"
      _self:
        parent_codes: *atc_parent_code
        description: >-
          f"End of medication without an ATC7 code in the source; ATC5 category {$id_atc5} (CDSL
          medication_05.id_atc5)" if (($id_atc7 ?? "") == "")

