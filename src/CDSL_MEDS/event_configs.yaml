medication_05:
  medication_start:
    code: f"MEDICATION//ATC5//{$id_atc5}//ATC7//{$id_atc7 ?? 'UNKNOWN'}"
    time: $drug_start_date::?"%Y-%m-%d %H:%M:%S"
    numeric_value: $daily_avrg_dose::?float64
    text_value: $drug_comercial_name
    medication_id: $medication_id

    _metadata:
      atc7:
        id_atc7: $id_atc7
        description: $atc7_name
      # Rows without an ATC7 code, which the atc7 join cannot describe.
      _self:
        description: >-
          f"Medication without an ATC7 code in the source; ATC5 category {$id_atc5} (CDSL
          medication_05.id_atc5)" if (($id_atc7 ?? "") == "")
  medication_end:
    code: f"MEDICATION_END//ATC5//{$id_atc5}//ATC7//{$id_atc7 ?? 'UNKNOWN'}"
    time: $drug_end_date::?"%Y-%m-%d %H:%M:%S"
    text_value: $drug_comercial_name
    medication_id: $medication_id
    _metadata:
      atc7:
        id_atc7: $id_atc7
        description: >-
          f"End of medication: {$atc7_name} (CDSL atc7.atc7_name)"
      _self:
        description: >-
          f"End of medication without an ATC7 code in the source; ATC5 category {$id_atc5} (CDSL
          medication_05.id_atc5)" if (($id_atc7 ?? "") == "")

lab_06:
