    numeric_value: $val_result::?float64
    text_value: $result_text ?? $val_result
    reference_range: $ref_values
    lab_id: $lab_id
    _metadata:
      _self:
        description: >-
          f"Laboratory test: {$item_lab}; unit: {$ud_result ?? 'UNKNOWN'} (CDSL lab_06.item_lab,
          lab_06.ud_result)"

